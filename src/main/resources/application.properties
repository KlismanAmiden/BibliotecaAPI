spring.config.import=optional:file:.env[.properties]

spring.application.name=Biblioteca

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.admin.nome=${ADMIN_NOME}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_SENHA}
app.admin.telefone=${ADMIN_TELEFONE}

server.port=${PORT:8900}
